name: rando_alerte
description: "Application de guidage et signalement pour la randonnée."
publish_to: 'none'
version: 1.0.0+1

# 1. AJOUTEZ CE BLOC ICI (juste avant les dépendances)
environment:
  sdk: '>=3.0.0 <4.0.0' # Ou '^3.11.0' comme suggéré par votre terminal

# 2. VOTRE BLOC DE DÉPENDANCES EXISTANT (bien aligné)
dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.5
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  file_picker: ^8.1.4
  xml: ^6.5.0
  http: ^1.2.2
  flutter_map_tile_caching: ^10.1.1
  supabase_flutter: ^2.8.3
  url_launcher: ^6.3.1